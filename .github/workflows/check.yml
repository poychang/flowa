name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:licenses
      - run: pnpm test:relay
      - run: pnpm package:relay ci-relay
      - run: pnpm test:release
      - run: pnpm test:soak
        env:
          SOAK_SECONDS: 24
          SOAK_RECONNECT_SECONDS: 8
          SOAK_OFFLINE_SECONDS: 2
      - run: pnpm test:device-server
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - run: pnpm test:cross-browser
      - run: pnpm test:devices
      - run: pnpm build
      - run: pnpm test:performance
        env:
          PERF_SECONDS: 6
      - run: pnpm test:performance
        env:
          PERF_SECONDS: 6
          PERF_WORKLOAD: mixed
      - run: pnpm test:pwa
      - run: pnpm build:relay
      - run: pnpm test:relay-launcher
      - run: pnpm build:devices
        env:
          DEVICE_ORIGIN: https://localhost:8443
          DEVICE_RELAY_ORIGIN: https://localhost:8444
      - run: pnpm test:device-launcher
      - uses: actions/upload-artifact@v4
        with:
          name: relay-linux-${{ github.sha }}
          path: |
            release-artifacts/ci-relay.tar.gz
            release-artifacts/ci-relay.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
